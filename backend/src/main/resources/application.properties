spring.application.name=backend

# 기본 8080은 이 머신에서 VirtualBox(test-server-vm)가 이미 쓰고 있어서 8090을 기본값으로 둔다.
# IntelliJ에서 그냥 Run 해도, gradlew로 켜도 동일하게 8090으로 뜨도록 여기서 고정.
server.port=${SERVER_PORT:8090}

# Postgres running in the VM, reached via VirtualBox NAT port forward (127.0.0.1:5432 -> VM:5432)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/${DB_NAME:shopping_mall}
spring.datasource.username=${DB_USER:shopping_admin}
spring.datasource.password=${DB_PASSWORD:qiV4KHzp5lfgbrHj62XL}

# Flyway owns the schema (V1__init_schema.sql = document/03-설계/schema.sql, V2__seed_dev_data.sql = dev-only seed data).
# Hibernate only validates entity mappings against it, never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# JWT - dev-only default secret, override via env var in real environments
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes+}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:14}

# Local file storage (StorageService) - swappable for S3/R2 later behind the same interface
app.storage.local-dir=${STORAGE_DIR:storage/uploads}
app.storage.public-path=/uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.path=/docs
